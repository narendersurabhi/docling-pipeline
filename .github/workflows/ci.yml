name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-policy:
    # Constitution VIII: one feature, one branch (spec/NNN-name), merged only via PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch name, spec folder and tasks
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE...HEAD" > changed.txt
          python3 scripts/branch_policy.py "$BRANCH" $(cat changed.txt)

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1" # NFR-002: the default suite must not download models
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (uv-managed interpreter, locked deps)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Spec traceability (NFR-003)
        run: uv run python scripts/spec_coverage.py

      - name: Tests
        run: uv run pytest -q
